plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

tasks.named('jar') {
    from(sourceSets.main.output)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

def fabricJarFile = layout.buildDirectory.file("libs/${project.archives_base_name}-${project.version}.jar")

tasks.register('copyFabricJar', Copy) {
    dependsOn(tasks.named('jar'))
    from(tasks.named('jar').map { it.archiveFile })
    into(layout.buildDirectory.dir('libs'))
    rename { fabricJarFile.get().asFile.name }
}

tasks.named('build') {
    dependsOn(tasks.named('copyFabricJar'))
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {
        // Configure publishing repositories here.
    }
}
